<html lang="th">
<head>

  <title>07 • ปกหลัง | Portfolio By Siriwan</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(
        180deg,
        #FFFDE7 0%,
        #FFF9C4 50%,
        #FFF59D 100%
      );
      color: #301050;
    }

    .page {
      min-height: 100vh;
      padding: 25px 15px 50px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
    }

    /* NAVIGATION */
    .nav {
      background: #ffffff;
      padding: 14px 18px;
      border-radius: 30px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(48, 16, 80, 0.1);
      margin-bottom: 30px;
      border: 2px solid #FFF59D;
    }

    .nav a {
      color: #301050;
      text-decoration: none;
      font-weight: 600;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .nav a:hover {
      background: #FFF59D;
      transform: translateY(-1px);
    }

    .nav .active {
      color: #FDE047;
      background: #301050;
    }

    /* CONTENT */
    .content {
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 20px 35px;
      box-shadow: 0 10px 30px rgba(48, 16, 80, 0.08);
      border: 2px solid #FFE082;
      text-align: center;
    }

    h1 {
      color: #1A0B2E;
      font-size: clamp(26px, 5vw, 36px);
      margin: 0 0 25px;
    }

    .cover-image {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      margin: 0 auto 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(48, 16, 80, 0.2);
      border: 4px solid #ffffff;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .bottom-nav a {
      background: #301050;
      color: #FFFFFF;
      padding: 10px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
    }

    .bottom-nav a:hover {
      background: #6A1B9A;
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      color: #7B1FA2;
      margin-top: 25px;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .page {
        padding: 12px 8px 30px;
      }

      .nav {
        border-radius: 20px;
        padding: 12px 8px;
        gap: 5px;
      }

      .nav a {
        font-size: 12px;
        padding: 6px 8px;
      }

      .content {
        padding: 22px 10px 28px;
        border-radius: 20px;
      }

      .cover-image {
        border-radius: 12px;
        border-width: 3px;
      }
    }
  </style>
</head>

<body>

    <div class="container">

        </a>

        <a href="./กิจกรรมเข้าร่วม.html">

        </a>

        <a href="./ปกหลัง.html" class="active">
          07 ปกหลัง
        </a>

      </div>


      <!-- CONTENT -->
      <div class="content">

        <h1>

        <!-- รูปปกหลัง 10.png -->

        <!-- BOTTOM NAVIGATION -->

      </div>


      <div class="footer">
        Portfolio By Siriwan 💜
      </div>

    </div>
  </div>

</body>
