<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>05 • กิจกรรมที่ภาคภูมิใจ | Portfolio By Siriwan</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(
        180deg,
        #FFFFE0 0%,
        #FFF9C4 50%,
        #FFF59D 100%
      );
      color: #4A148C;
    }

    .page {
      min-height: 100vh;
      padding: 30px 15px 50px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(74, 20, 140, 0.15);
    }

    /* เมนู */
    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .nav a {
      display: inline-block;
      text-decoration: none;
      color: #FFFFFF;
      background: #7B1FA2;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .nav a:hover {
      background: #4A148C;
      transform: translateY(-2px);
    }

    /* หัวข้อ */
    h1 {
      margin: 10px 0 5px;
      text-align: center;
      color: #6A1B9A;
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 700;
    }

    .subtitle {
      margin: 0 auto 30px;
      text-align: center;
      color: #8E24AA;
      font-size: 16px;
    }

    /* รูปภาพ */
    .images {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .image-card {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .image-card img {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(74, 20, 140, 0.18);
      background: #FFFFFF;
    }

    /* ปุ่มด้านล่าง */
    .bottom-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 35px;
    }

    .bottom-nav a {
      display: inline-block;
      text-decoration: none;
      color: #FFFFFF;
      background: #6A1B9A;
      padding: 11px 20px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .bottom-nav a:hover {
      background: #4A148C;
      transform: translateY(-2px);
    }

    /* มือถือ */
    @media (max-width: 600px) {

      .page {
        padding: 15px 8px 35px;
      }

      .container {
        padding: 15px 10px;
        border-radius: 18px;
      }

      .nav {
        gap: 7px;
      }

      .nav a {
        font-size: 13px;
        padding: 8px 12px;
      }

      h1 {
        font-size: 29px;
        line-height: 1.3;
      }

      .subtitle {
        font-size: 14px;
      }

      .images {
        gap: 15px;
      }

      .image-card img {
        border-radius: 12px;
      }

      .bottom-nav {
        gap: 8px;
      }

      .bottom-nav a {
        font-size: 13px;
        padding: 9px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="container">

      <!-- เมนูด้านบน -->
      <div class="nav">

        <a href="./ประวัติการศึกษา.html">
          ← 04 การศึกษา
        </a>

        <a href="./index.html">
          🏠 หน้าหลัก
        </a>

        <a href="./กิจกรรมเข้าร่วม.html">
          06 กิจกรรม →
        </a>

      </div>


      <!-- หัวข้อ -->
      <h1>
        05 • กิจกรรมที่ภาคภูมิใจ
      </h1>

      <div class="subtitle">
        กิจกรรมและผลงานที่สร้างความภาคภูมิใจให้กับฉัน
      </div>


      <!-- รูปกิจกรรม -->
      <div class="images">

        <!-- รูป 6.png -->
        <div class="image-card">
          <img
            src="https://github.com/fayy-cpu/portfolio_/blob/main/6.png?raw=true"
            alt="กิจกรรมที่ภาคภูมิใจ รูปที่ 1"
          >
        </div>

        <!-- รูป 7.png -->
        <div class="image-card">
          <img
            src="https://github.com/fayy-cpu/portfolio_/blob/main/7.png?raw=true"
            alt="กิจกรรมที่ภาคภูมิใจ รูปที่ 2"
          >
        </div>

        <!-- รูป 8.png -->
        <div class="image-card">
          <img
            src="https://github.com/fayy-cpu/portfolio_/blob/main/8.png?raw=true"
            alt="กิจกรรมที่ภาคภูมิใจ รูปที่ 3"
          >
        </div>

      </div>


      <!-- ปุ่มด้านล่าง -->
      <div class="bottom-nav">

        <a href="./ประวัติการศึกษา.html">
          ← ย้อนกลับ
        </a>

        <a href="./index.html">
          🏠 หน้าหลัก
        </a>

        <a href="./กิจกรรมเข้าร่วม.html">
          กิจกรรมเข้าร่วม →
        </a>

      </div>

    </div>

  </div>

</body>
</html>
