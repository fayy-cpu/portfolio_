<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>05 • กิจกรรมที่ภาคภูมิใจ | Portfolio By Siriwan</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(180deg, #FFFFE0 0%, #FFF9C4 50%, #FFF59D 100%);
      color: #4A148C;
    }

    .page {
      min-height: 100vh;
      padding: 25px 12px 45px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(255,255,255,0.92);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(74,20,140,0.15);
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .nav a {
      text-decoration: none;
      color: white;
      background: #7B1FA2;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 14px;
      transition: 0.2s;
    }

    .nav a:hover {
      background: #4A148C;
      transform: translateY(-2px);
    }

    h1 {
      text-align: center;
      color: #6A1B9A;
      font-size: clamp(28px, 6vw, 42px);
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #8E24AA;
      margin-bottom: 25px;
      font-size: 16px;
    }

    .images {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .images img {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 8px 22px rgba(74,20,140,0.18);
      background: white;
    }

    .bottom-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .bottom-nav a {
      text-decoration: none;
      color: white;
      background: #6A1B9A;
      padding: 11px 20px;
      border-radius: 999px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
        border-radius: 18px;
      }

      .nav a {
        font-size: 13px;
        padding: 8px 12px;
      }

      .images {
        gap: 15px;
      }

      .images img {
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="container">

    </div>

    <h1>05 • กิจกรรมที่ภาคภูมิใจ</h1>

    <div class="subtitle">
      กิจกรรมและผลงานที่สร้างความภาคภูมิใจให้กับฉัน
    </div>

      <img src="./6.png" alt="กิจกรรมที่ภาคภูมิใจ 1">

      <img src="./7.png" alt="กิจกรรมที่ภาคภูมิใจ 2">

      <img src="./8.png" alt="กิจกรรมที่ภาคภูมิใจ 3">

    </div>

    <div class="bottom-nav">

    </div>

  </div>

</div>

</html>
