<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 • กิจกรรมที่ภาคภูมิใจ | Portfolio By Siriwan</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
      background: linear-gradient(180deg, #FFFDE7 0%, #FFF9C4 50%, #FFF59D 100%);
      color: #4A148C;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 25px 15px 50px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(74,20,140,0.15);
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .nav a {
      text-decoration: none;
      color: #4A148C;
      background: #FFF59D;
      border: 2px solid #CE93D8;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 500;
      transition: 0.2s;
    }

    .nav a:hover {
      background: #CE93D8;
      color: white;
      transform: translateY(-2px);
    }

    h1 {
      text-align: center;
      margin: 10px 0 8px;
      font-size: clamp(28px, 6vw, 45px);
      color: #6A1B9A;
    }

    .subtitle {
      text-align: center;
      color: #7B1FA2;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .images {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .images img {
      display: block;
      width: 100%;
      max-width: 850px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(74,20,140,0.18);
      border: 4px solid white;
    }

    .bottom-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 35px;
    }

    .bottom-nav a {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #6A1B9A, #AB47BC);
      padding: 11px 20px;
      border-radius: 25px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(106,27,154,0.2);
    }

    .bottom-nav a:hover {
      transform: translateY(-2px);
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #7B1FA2;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 12px 8px 30px;
      }

      .container {
        padding: 15px 10px;
        border-radius: 18px;
      }

      .nav a {
        font-size: 13px;
        padding: 7px 10px;
      }

      .images {
        gap: 15px;
      }

      .images img {
        border-radius: 12px;
        border-width: 3px;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="container">

      <!-- เมนูด้านบน -->
      <div class="nav">
        <a href="./ประวัติการศึกษา.html">← 04 การศึกษา</a>
        <a href="./index.html">🏠 หน้าหลัก</a>
        <a href="./กิจกรรมเข้าร่วม.html">06 กิจกรรม →</a>
      </div>

      <!-- หัวข้อ -->
      <h1>05 • กิจกรรมที่ภาคภูมิใจ</h1>

      <div class="subtitle">
        ผลงานและกิจกรรมที่ฉันภาคภูมิใจ 💜✨
      </div>

      <!-- รูปกิจกรรม 5 / 6 / 7 -->
      <div class="images">

        <img
          src="https://github.com/fayy-cpu/portfolio_/blob/main/5.png?raw=true"
          alt="5.png"
        >

        <img
          src="https://github.com/fayy-cpu/portfolio_/blob/main/6.png?raw=true"
          alt="6.png"
        >

        <img
          src="https://github.com/fayy-cpu/portfolio_/blob/main/7.png?raw=true"
          alt="7.png"
        >

      </div>

      <!-- เมนูด้านล่าง -->
      <div class="bottom-nav">
        <a href="./ประวัติการศึกษา.html">← ย้อนกลับ</a>
        <a href="./index.html">🏠 หน้าหลัก</a>
        <a href="./กิจกรรมเข้าร่วม.html">กิจกรรมเข้าร่วม →</a>
      </div>

      <div class="footer">
        Portfolio By Siriwan 💜
      </div>

    </div>
  </div>

</body>
</html>
